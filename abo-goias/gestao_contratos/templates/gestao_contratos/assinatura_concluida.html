<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Assinatura concluída — ABO Goiás</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f2f4f8; color: #1c2733; padding: 24px;
            display: flex; justify-content: center; align-items: center;
            min-height: 90vh; margin: 0;
        }
        .card {
            max-width: 480px; background: #fff; border-radius: 12px;
            box-shadow: 0 2px 14px rgba(20,40,70,.08); padding: 28px;
            text-align: center;
        }
        h1 { font-size: 1.25rem; margin: 12px 0 8px; color: #0b6e4f; }
        p { color: #5a6b80; font-size: .95rem; line-height: 1.5; }
        .icone { font-size: 2.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">✅</div>
        <h1>Assinatura registrada com sucesso!</h1>
        <p>
            Obrigado, {{ paciente.nome }}. O termo de consentimento
            ({{ contrato.get_tipo_display }}) foi assinado e salvo.
        </p>
        <p style="margin-top: 10px;">
            Você já pode fechar esta página. A recepção dará continuidade
            ao atendimento.
        </p>
    </div>
</body>
</html>
