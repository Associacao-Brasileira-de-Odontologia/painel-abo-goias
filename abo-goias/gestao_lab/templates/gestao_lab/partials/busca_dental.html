<div class="sidebar-section">
    <p class="section-label">Não encontrou na lista?</p>
    <p class="panel-copy">Digite o nome para procurar entre todos os cadastros da clínica.</p>

    <form class="form-stack js-loading-submit" method="get" action="{% url 'lab_buscar_paciente' %}">
        <input type="hidden" name="next" value="{{ busca_next }}">
        <div class="field">
            <label for="q-paciente-dental">Paciente</label>
            <input id="q-paciente-dental" type="search" name="q" placeholder="Nome do paciente...">
        </div>
        <button class="button secondary" type="submit">Procurar paciente</button>
    </form>

    <form class="form-stack js-loading-submit" method="get" action="{% url 'lab_buscar_aluno' %}">
        <input type="hidden" name="next" value="{{ busca_next }}">
        <div class="field">
            <label for="q-aluno-dental">Aluno</label>
            <input id="q-aluno-dental" type="search" name="q" placeholder="Nome do aluno...">
        </div>
        <button class="button secondary" type="submit">Procurar aluno</button>
    </form>
</div>
