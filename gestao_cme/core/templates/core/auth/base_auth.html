{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de CME | {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/home.css' %}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card panel">
            <img class="auth-logo" src="{% static 'core/img/logo.png' %}" alt="ABO Goiás">
            <p class="section-label">{% block eyebrow %}{% endblock %}</p>
            <h1>{% block heading %}{% endblock %}</h1>
            <p class="panel-copy">{% block description %}{% endblock %}</p>
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
